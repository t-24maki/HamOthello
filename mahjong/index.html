<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f8f4e9" />
    <meta
      name="description"
      content="たくハム・めぐハム・3色のたぴのミニまーじゃん。9枚を3つの組にそろえて、4局の点数くらべ。"
    />
    <title>ミニまーじゃん — たくめぐのあそびば</title>
    <link rel="stylesheet" href="./style.css?v=20261022-mahjong7" />
    <script type="module" src="./game.js?v=20261022-mahjong7"></script>
    <link rel="stylesheet" href="../site-layout.css?v=20261022-site1" />
    <script type="module" src="../site-header.js?v=20261025-site5"></script>
  </head>
  <body data-site-page="mahjong">
    <takumegu-header data-page="mahjong"
      ><button slot="actions" id="menu" type="button" hidden>設定</button></takumegu-header
    >
    <main class="page">
      <header class="heading">
        <p class="eyebrow">9枚でつくる、ちいさな役</p>
        <h1>ミニ<span>まーじゃん</span></h1>
      </header>
      <section id="setup" class="setup" aria-label="対戦の設定">
        <div class="tile-intro" id="tile-intro" aria-hidden="true"></div>
        <p class="intro">3枚ずつ、3つの組。<br />たくハムとめぐハムの、4局勝負。</p>
        <div class="choices" role="group" aria-label="対戦モード">
          <button type="button" data-mode="cpu" aria-pressed="true">CPUとあそぶ</button>
          <button type="button" data-mode="online" aria-pressed="false">通信でふたり</button>
        </div>
        <div id="cpu-options">
          <p id="start-note" class="setup-note">あなたはたくハム、CPUはめぐハム。</p>
          <button id="start" class="primary" type="button">対局をはじめる →</button>
        </div>
        <div id="online-options" hidden>
          <div class="choices room-choices" role="group" aria-label="へやの参加方法">
            <button id="host-room" type="button" aria-pressed="true">へやをつくる</button
            ><button id="join-room" type="button" aria-pressed="false">へやに入る</button>
          </div>
          <label id="join-field" hidden
            >へやのキーワード<input
              id="room-input"
              placeholder="HAMU-ABC234"
              maxlength="16"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
          /></label>
          <div id="room-waiting" hidden>
            <small>相手にキーワードを教えてね</small><output id="room-code"></output
            ><button id="copy-room" type="button">コピー</button>
          </div>
          <p id="connection-note" class="setup-note" role="status"></p>
          <div class="connect-actions">
            <button id="connect" class="primary" type="button">へやをつくる →</button
            ><button id="cancel-connect" type="button" hidden>やめる</button>
          </div>
        </div>
        <p id="load-note" class="load-note" role="status"></p>
      </section>
      <section id="match" hidden aria-label="ミニまーじゃんの対局">
        <div class="scoreboard">
          <div class="score tak">
            <img src="../assets/pink-piece.png" alt="" /><span id="name-0">たくハム</span
            ><strong id="score-0">0<small>点</small></strong>
          </div>
          <div class="round-count"><strong id="round-label">1 / 4</strong><span>局</span></div>
          <div class="score meg">
            <img src="../assets/cream-piece.png" alt="" /><span id="name-1">めぐハム</span
            ><strong id="score-1">0<small>点</small></strong>
          </div>
        </div>
        <div class="table">
          <div class="rack-label">
            <span id="opponent-name">相手の手牌</span><span id="dealer-label">たくハムから</span>
          </div>
          <div id="opponent-hand" class="opponent-hand" aria-label="相手の手牌"></div>
          <div class="river-pair">
            <section>
              <h2 id="river-opponent-label">相手の捨て牌</h2>
              <div id="river-opponent" class="river"></div>
            </section>
            <section>
              <h2 id="river-you-label">あなたの捨て牌</h2>
              <div id="river-you" class="river"></div>
            </section>
          </div>
          <div class="table-center">
            <span class="wall-count">山 <b id="wall-count">23</b>枚</span
            ><span class="table-wordmark">TAK&MEG<br /><small>MINI MAHJONG</small></span
            ><span id="turn-chip" class="turn-chip">あなたの番</span>
          </div>
          <div class="hand-heading">
            <span id="hand-label">あなたの手牌</span><span id="drawn-label"></span>
          </div>
          <div
            id="hand"
            class="hand"
            role="group"
            aria-label="手牌。同じ牌を2回タップすると捨てます。"
          ></div>
        </div>
        <div class="action-panel">
          <p id="status" role="status" aria-live="polite"></p>
          <div class="play-actions">
            <button id="discard" class="primary" type="button" disabled>牌を選んでね</button>
            <button id="riichi" type="button" disabled>リーチ ＋1点</button>
            <button id="claim" class="primary claim-button" type="button" hidden>ロン！</button>
            <button id="show-result" class="primary" type="button" hidden>点数を見る →</button>
          </div>
          <p id="selection-note" class="selection-note"></p>
        </div>
        <div class="round-history" id="round-history" aria-label="各局の結果"></div>
      </section>
      <details class="rules">
        <summary>あそびかた・点数</summary>
        <div id="rules-content"></div>
      </details>
      <footer>ひとつ引いて、ひとつ選んで。<span>TAK&MEG</span></footer>
    </main>
    <dialog id="result" aria-labelledby="result-title">
      <p id="result-eyebrow" class="eyebrow"></p>
      <h2 id="result-title" tabindex="-1"></h2>
      <div id="round-result">
        <p id="result-description"></p>
        <div id="result-tile" class="result-tile"></div>
        <div id="result-groups" class="result-groups"></div>
        <div id="result-points" class="result-points"></div>
      </div>
      <div id="match-result" hidden></div>
      <button id="next" class="primary" type="button">次の局へ →</button
      ><button id="review-round" type="button" hidden>4局目の結果を見る</button
      ><button id="review-board" type="button">盤面をもう一度見る</button
      ><button id="finish-menu" type="button">設定にもどる</button>
    </dialog>
    <dialog id="leave-dialog" aria-labelledby="leave-title">
      <h2 id="leave-title">対局を終えて、設定にもどる？</h2>
      <p>この4局の勝負は、ここまでになります。</p>
      <div class="choices">
        <button id="stay" type="button">対局をつづける</button
        ><button id="leave" type="button">設定にもどる</button>
      </div>
    </dialog>
  </body>
</html>
