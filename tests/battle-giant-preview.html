<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base href="../battle/" />
  <title>巨大化タイマー・描画確認</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fff9ef;
      color: #554c54;
      margin: 16px;
    }
    h1 {
      font-size: 20px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      min-height: 44px;
      padding: 8px 14px;
      font: inherit;
    }
    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      max-width: 1100px;
    }
    figure {
      margin: 0;
    }
    canvas {
      width: 100%;
      display: block;
      border-radius: 12px;
    }
    figcaption {
      padding: 8px;
    }
    @media (max-width: 600px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <h1>巨大化タイマー・描画確認（開発用）</h1>
  <nav>
    <button id="warning">残り3秒から再生</button>
    <button id="faded">点滅の薄い状態で停止</button>
    <button id="collect">薬を再取得</button>
    <button id="normal">終了後を表示</button>
  </nav>
  <p id="status" role="status">画像を準備中</p>
  <main></main>
  <script type="module">
    import {
      CHARACTERS,
      createMatch,
      tick,
      advance,
      pause,
      resume,
      hurtbox,
      EMPTY_INPUT,
    } from "../battle/engine.js?v=20261017-battle19";
    import { loadArt, render } from "../battle/renderer.js?v=20261017-battle19";
    import { getStage, mainPlatform, surfaceAt } from "../battle/stages.js?v=20261017-battle19";
    const art = await loadArt(),
      main = document.querySelector("main");
    const scenes = Object.keys(CHARACTERS).map((key) => {
      const g = createMatch(key, "easy", "meadow", key, 42);
      g.phase = "playing";
      const floor = mainPlatform(getStage(g.stageId));
      g.fighters.forEach((f, i) => {
        f.x = i ? 590 : 300;
        f.y = surfaceAt(floor, f.x);
      });
      const figure = document.createElement("figure"),
        caption = document.createElement("figcaption"),
        canvas = document.createElement("canvas");
      canvas.width = 800;
      canvas.height = 500;
      caption.textContent = CHARACTERS[key].name;
      figure.append(caption, canvas);
      main.append(figure);
      return { g, c: canvas.getContext("2d") };
    });
    function collect(g) {
      const body = hurtbox(g.fighters[0]);
      g.items.wait = 0;
      g.items.potion = { x: body.x, y: body.y, vy: 0, platformId: null };
      g.phase = "playing";
      tick(g);
      g.items.wait = 12;
    }
    function draw() {
      scenes.forEach(({ g, c }) => render(c, art, g, g.elapsed));
      document.querySelector("#status").textContent =
        `巨大化の残り時間：${scenes[0].g.fighters[0].giantTime.toFixed(2)}秒`;
    }
    function reset(time, stopped) {
      scenes.forEach(({ g }) => {
        collect(g);
        g.fighters[0].giantTime = time;
        g.effects = [];
        if (!time) tick(g);
        if (stopped) pause(g);
      });
      draw();
    }
    document.querySelector("#warning").onclick = () => reset(3, false);
    document.querySelector("#faded").onclick = () => reset(2.75, true);
    document.querySelector("#collect").onclick = () => {
      scenes.forEach(({ g }) => {
        resume(g);
        collect(g);
      });
      draw();
    };
    document.querySelector("#normal").onclick = () => reset(0, true);
    reset(2.75, true);
    let last = performance.now();
    function frame(now) {
      const dt = (now - last) / 1000;
      last = now;
      scenes.forEach(({ g }) => advance(g, dt, () => [EMPTY_INPUT, EMPTY_INPUT]));
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</html>
